<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudySync</title>

    <!-- React & Tailwind --> 
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #1a1a1a; color: white; -webkit-tap-highlight-color: transparent; }
        .animate-fade-in { animation: fadeIn 0.2s ease-out; }
        .animate-slide-down { animation: slideDown 0.3s ease-out forwards; }
        .animate-pop-up { animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        video { transform: scaleX(1); }
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #4b5563;
            border-radius: 2px;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const DEFAULT_AVATAR = "./default-avatar.png";
    let auth = null;
    let db = null;
    let CLOUD_NAME = "";
    let UPLOAD_PRESET = "";

    // --- ICONS & AVATAR ---
    const IconBase = ({ children, size = 24, className = "" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            {children}
        </svg>
    );

    const Avatar = ({ src, className = "", alt = "avatar" }) => (
        <img
            src={src || DEFAULT_AVATAR}
            alt={alt}
            onError={(e) => {
                if (e.target.src !== DEFAULT_AVATAR) {
                    e.target.onerror = null;
                    e.target.src = DEFAULT_AVATAR;
                }
            }}
            className={className}
        />
    );

    const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3" /></IconBase>;
    const Pause = (props) => <IconBase {...props}><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></IconBase>;
    const Square = (props) => <IconBase {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /></IconBase>;
    const Users = (props) => <IconBase {...props}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></IconBase>;
    const Trophy = (props) => <IconBase {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17" /><path d="M14 14.66V17" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /><path d="M12 22v-5" /></IconBase>;
    const SettingsIcon = (props) => <IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></IconBase>;
    const X = (props) => (<IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconBase>);
    const Check = (props) => <IconBase {...props}><polyline points="20 6 9 17 4 12" /></IconBase>;
    const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></IconBase>;
    const SignOutIcon = (props) => <IconBase {...props}><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" /><path d="M10 17l5-5-5-5" /><path d="M10 12H3" /></IconBase>;
    const Camera = (props) => <IconBase {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /><circle cx="12" cy="13" r="3" /></IconBase>;
    const Image = (props) => <IconBase {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" /></IconBase>;
    const Eye = (props) => <IconBase {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></IconBase>;
    const SwitchCam = (props) => <IconBase {...props}><path d="M1 4v6h6" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></IconBase>;
    const Bell = (props) => <IconBase {...props}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></IconBase>;
    const Trash = (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></IconBase>;
    const ChevronLeft = (props) => <IconBase {...props}><polyline points="15 18 9 12 15 6" /></IconBase>;
    const ChevronRight = (props) => <IconBase {...props}><polyline points="9 18 15 12 9 6" /></IconBase>;
    const Edit = (props) => <IconBase {...props}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></IconBase>;

    // --- NOTIFICATION COMPONENT ---
    const Notification = ({ message, type, onClose }) => {
        if (!message) return null;
        const bgColor = type === 'error' ? 'bg-red-600' : 'bg-blue-600';
        const icon = type === 'error' ? <X size={20} /> : <Bell size={20} />;

        return (
            <div className={`fixed top-4 left-4 right-4 z-[210] ${bgColor} text-white p-4 rounded-xl shadow-2xl flex items-center space-x-3 animate-slide-down pointer-events-auto border border-white/10`}>
                <div className="bg-white/20 p-2 rounded-full">{icon}</div>
                <div className="flex-1 font-bold text-sm shadow-black drop-shadow-md">{message}</div>
                <button onClick={onClose} className="p-1 opacity-70 hover:opacity-100">
                    <span className="text-lg font-bold leading-none">x</span>
                </button>
            </div>
        );
    };

    // --- RESET PASSWORD STATUS MODAL ---
    const ResetPasswordStatusModal = ({ stage, onClose }) => {
        if (!stage) return null;
        const isSending = stage === 'sending';
        return (
            <div className="fixed inset-0 z-[110] bg-black/80 backdrop-blur-sm flex items-center justify-center p-6">
                <div className="bg-gray-900 w-full max-w-sm rounded-2xl p-6 border border-purple-500/30 space-y-4 text-center">
                    {isSending ? (
                        <>
                            <h3 className="text-xl font-bold text-white">Sending reset password link...</h3>
                            <p className="text-sm text-gray-400">Hang tight while we email you a secure link.</p>
                            <div className="w-12 h-12 mx-auto border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
                        </>
                    ) : (
                        <>
                            <h3 className="text-2xl font-bold text-white">Check your email</h3>
                            <p className="text-sm text-gray-300">We sent a reset link. Please check your inbox and spam folder.</p>
                            <button onClick={onClose} className="w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-bold text-white transition">Close</button>
                        </>
                    )}
                </div>
            </div>
        );
    };

    // --- IMAGE CROPPER COMPONENT ---
    const ImageCropper = ({ src, onCancel, onConfirm }) => {
        const [zoom, setZoom] = React.useState(1);
        const [offset, setOffset] = React.useState({ x: 0, y: 0 });
        const [isDragging, setIsDragging] = React.useState(false);
        const [startPan, setStartPan] = React.useState({ x: 0, y: 0 });
        const imgRef = React.useRef(null);
        const containerSize = 250; 

        const handleStart = (clientX, clientY) => {
            setIsDragging(true);
            setStartPan({ x: clientX - offset.x, y: clientY - offset.y });
        };

        const handleMove = (clientX, clientY) => {
            if (!isDragging) return;
            setOffset({
                x: clientX - startPan.x,
                y: clientY - startPan.y
            });
        };

        const handleEnd = () => setIsDragging(false);

        React.useEffect(() => {
            const move = (e) => handleMove(e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY);
            const end = () => handleEnd();
            
            if(isDragging) {
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', end);
                window.addEventListener('touchmove', move);
                window.addEventListener('touchend', end);
            }
            return () => {
                window.removeEventListener('mousemove', move);
                window.removeEventListener('mouseup', end);
                window.removeEventListener('touchmove', move);
                window.removeEventListener('touchend', end);
            };
        }, [isDragging, startPan]);

        const performCrop = () => {
            const canvas = document.createElement('canvas');
            const outputSize = 500;
            canvas.width = outputSize;
            canvas.height = outputSize;
            const ctx = canvas.getContext('2d');

            const img = imgRef.current;
            const scaleFactor = 1 / zoom;
            const sx = -offset.x * scaleFactor;
            const sy = -offset.y * scaleFactor;
            const sWidth = containerSize * scaleFactor;
            const sHeight = containerSize * scaleFactor;

            ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, outputSize, outputSize);

            canvas.toBlob(blob => {
                onConfirm(blob);
            }, 'image/jpeg', 0.9);
        };

        return (
            <div className="fixed inset-0 bg-black/90 z-[80] flex flex-col items-center justify-center p-4 animate-fade-in">
                <h3 className="text-xl font-bold text-white mb-6">Adjust Profile Picture</h3>
                <div 
                    className="relative overflow-hidden rounded-full border-4 border-blue-500 shadow-[0_0_30px_rgba(59,130,246,0.5)] cursor-move bg-black"
                    style={{ width: containerSize, height: containerSize }}
                    onMouseDown={e => handleStart(e.clientX, e.clientY)}
                    onTouchStart={e => handleStart(e.touches[0].clientX, e.touches[0].clientY)}
                >
                    <img 
                        ref={imgRef}
                        src={src}
                        draggable={false}
                        style={{
                            transform: `translate(${offset.x}px, ${offset.y}px) scale(${zoom})`,
                            transformOrigin: 'top left',
                            pointerEvents: 'none',
                            position: 'absolute',
                            maxWidth: 'none',
                            maxHeight: 'none'
                        }}
                    />
                </div>

                <div className="w-64 mt-8 mb-8 space-y-2">
                    <div className="flex justify-between text-xs text-gray-400 font-bold uppercase">
                        <span>Zoom</span>
                        <span>{(zoom * 100).toFixed(0)}%</span>
                    </div>
                    <input 
                        type="range" 
                        min="0.1" 
                        max="3" 
                        step="0.05" 
                        value={zoom} 
                        onChange={e => setZoom(parseFloat(e.target.value))} 
                        className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                    />
                </div>

                <div className="flex space-x-6">
                    <button onClick={onCancel} className="w-16 h-16 rounded-full bg-red-600/20 text-red-500 border-2 border-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition">
                        <X size={28} />
                    </button>
                    <button onClick={performCrop} className="w-20 h-20 rounded-full bg-green-500 text-white flex items-center justify-center shadow-[0_0_20px_rgba(34,197,94,0.6)] hover:bg-green-400 transition transform hover:scale-105">
                        <Check size={36} strokeWidth={4} />
                    </button>
                </div>
            </div>
        );
    };

    // --- MAIN APP COMPONENT ---
    const App = () => {
        const [user, setUser] = React.useState(null);
        const [userData, setUserData] = React.useState(null);
        const [view, setView] = React.useState('loading');
        const [loading, setLoading] = React.useState(true);
        const [configError, setConfigError] = React.useState(null);
        const [notification, setNotification] = React.useState(null);

        const showToast = (msg, type = 'success') => {
            setNotification({ message: msg, type });
            setTimeout(() => setNotification(null), 3500);
        };

        React.useEffect(() => {
            async function initApp() {
                try {
                    const response = await fetch('./keys.json');
                    if (!response.ok) {
                        throw new Error(`Failed to load keys.json (${response.statusText})`);
                    }
                    const keys = await response.json();

                    CLOUD_NAME = keys.cloudinary?.cloudName || "";
                    UPLOAD_PRESET = keys.cloudinary?.uploadPreset || "";

                    if (!firebase.apps.length) {
                        firebase.initializeApp(keys.firebaseConfig);
                    }
                    auth = firebase.auth();
                    db = firebase.firestore();

                    const unsubscribe = auth.onAuthStateChanged(async (u) => {
                        if (u) {
                            setUser(u);
                            const docRef = db.collection('users').doc(u.uid);
                            docRef.onSnapshot(doc => {
                                if (doc.exists) setUserData(doc.data());
                            });
                            setView('home');
                        } else {
                            setUser(null);
                            setUserData(null);
                            setView('login');
                        }
                        setLoading(false);
                    });

                    return () => unsubscribe();
                } catch (err) {
                    console.error("Initialization error:", err);
                    setConfigError(err.message);
                    setLoading(false);
                }
            }

            initApp();
        }, []);

        if (loading) return <div className="h-screen w-full flex items-center justify-center bg-gray-900 text-white font-bold">Connecting...</div>;
        if (configError) return <div className="h-screen w-full flex items-center justify-center bg-gray-900 text-red-400 font-bold p-6 text-center">Error loading configuration: {configError}</div>;

        return (
            <div className="max-w-md mx-auto h-screen bg-gray-900 flex flex-col relative overflow-hidden font-sans">
                {notification && <Notification message={notification.message} type={notification.type} onClose={() => setNotification(null)} />}

                {view === 'login' && <Login setView={setView} showToast={showToast} />}
                {view === 'register' && <Register setView={setView} showToast={showToast} />}

                {user && !userData && (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-gray-900 text-white space-y-4">
                        <div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                        <p>Setting up your profile...</p>
                    </div>
                )}

                {user && userData && (
                    <>
                        <div className="flex-1 overflow-y-auto no-scrollbar pb-20">
                            {view === 'home' && <Home user={user} userData={userData} showToast={showToast} />}
                            {view === 'friends' && <Friends user={user} showToast={showToast} />}
                            {view === 'leaderboard' && <Leaderboard user={user} />}
                            {view === 'settings' && <Settings user={user} userData={userData} showToast={showToast} />}
                        </div>
                        <BottomNav view={view} setView={setView} />
                    </>
                )}
            </div>
        );
    };

    // --- LOGIN COMPONENT ---
    const Login = ({ setView, showToast }) => {
        const [email, setEmail] = React.useState('');
        const [pass, setPass] = React.useState('');
        const [isResetting, setIsResetting] = React.useState(false);
        const [resetStage, setResetStage] = React.useState(null);

        const handleLogin = async (e) => {
            e.preventDefault();
            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (e) {
                showToast(e.message, 'error');
            }
        };

        const handleResetPassword = async (e) => {
            e.preventDefault();
            if (!email) return showToast("Please enter your email", "error");
            setResetStage('sending');
            setIsResetting(true);
            try {
                await auth.sendPasswordResetEmail(email);
                setResetStage('sent');
                showToast("Reset link sent! Check your email.");
            } catch (e) {
                setResetStage(null);
                showToast(e.message, "error");
            }
        };

        const handleResetModalClose = () => {
            setResetStage(null);
            setIsResetting(false);
        };

        return (
            <>
                <ResetPasswordStatusModal stage={resetStage} onClose={handleResetModalClose} />
                {isResetting ? (
                    <div className="p-8 flex flex-col justify-center h-full space-y-4 animate-fade-in">
                        <h1 className="text-3xl font-bold text-blue-500 mb-2">Reset Password</h1>
                        <p className="text-gray-400 text-sm mb-4">Enter your email address and we'll send you a link to reset your password.</p>
                        <input type="email" placeholder="Enter your email" className="p-3 bg-gray-800 rounded text-white outline-none focus:ring-2 ring-blue-500" value={email} onChange={e => setEmail(e.target.value)} />
                        <button onClick={handleResetPassword} disabled={resetStage === 'sending'} className="bg-blue-600 p-3 rounded font-bold text-white hover:bg-blue-700 transition">
                            {resetStage === 'sending' ? 'Sending...' : 'Send Reset Link'}
                        </button>
                        <button onClick={() => { setIsResetting(false); setResetStage(null); }} className="text-gray-400 text-sm hover:text-white">Cancel</button>
                    </div>
                ) : (
                    <div className="p-8 flex flex-col justify-center h-full space-y-4 animate-fade-in">
                        <h1 className="text-4xl font-bold text-blue-500 mb-6">StudySync</h1>
                        <input type="email" placeholder="Email" className="p-3 bg-gray-800 rounded text-white outline-none focus:ring-2 ring-blue-500" value={email} onChange={e => setEmail(e.target.value)} />
                        <input type="password" placeholder="Password" className="p-3 bg-gray-800 rounded text-white outline-none focus:ring-2 ring-blue-500" value={pass} onChange={e => setPass(e.target.value)} />
                        <button onClick={handleLogin} className="bg-blue-600 p-3 rounded font-bold text-white hover:bg-blue-700 transition">Log In</button>
                        <div className="flex justify-between items-center mt-4">
                            <span onClick={() => setIsResetting(true)} className="text-blue-400 text-sm cursor-pointer hover:underline">Forgot Password?</span>
                            <span className="text-gray-400 text-sm">No account? <span onClick={() => setView('register')} className="text-blue-400 underline cursor-pointer">Register</span></span>
                        </div>
                    </div>
                )}
            </>
        );
    };

    // --- REGISTER COMPONENT ---
    const Register = ({ setView, showToast }) => {
        const [form, setForm] = React.useState({ email: '', pass: '', display: '', user: '' });
        const [file, setFile] = React.useState(null);
        const [uploading, setUploading] = React.useState(false);
        const [croppingSrc, setCroppingSrc] = React.useState(null);

        const uploadImage = async (file) => {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                return data.secure_url;
            } catch (error) {
                console.error("Upload failed", error);
                return null;
            }
        };

        const handleFileChange = (e) => {
            const selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = () => setCroppingSrc(reader.result);
                reader.readAsDataURL(selectedFile);
            }
        };

        const handleCropConfirm = (blob) => {
            setFile(blob);
            setCroppingSrc(null);
        };

        const handleReg = async () => {
            if (!form.email || !form.pass || !form.display || !form.user) {
                return showToast("All fields are required", 'error');
            }
            try {
                setUploading(true);
                const usernameDoc = await db.collection('usernames').doc(form.user).get();
                if (usernameDoc.exists) throw new Error("Username taken");

                let photoURL = DEFAULT_AVATAR;
                if (file) {
                    const url = await uploadImage(file);
                    if (url) photoURL = url;
                }

                const cred = await auth.createUserWithEmailAndPassword(form.email, form.pass);

                const batch = db.batch();
                batch.set(db.collection('users').doc(cred.user.uid), {
                    email: form.email,
                    displayName: form.display,
                    username: form.user,
                    photoURL,
                    coins: 0,
                    uid: cred.user.uid,
                    friends: []
                });
                batch.set(db.collection('usernames').doc(form.user), { uid: cred.user.uid });

                await batch.commit();
                showToast("Account created successfully!");
            } catch (e) {
                showToast(e.message, 'error');
            } finally { // Corrected from 'font-bold' to 'finally'
                setUploading(false);
            }
        };

        return (
            <div className="p-8 flex flex-col justify-center h-full space-y-3 overflow-y-auto">
                {croppingSrc && <ImageCropper src={croppingSrc} onCancel={() => { setCroppingSrc(null); setFile(null); }} onConfirm={handleCropConfirm} />}
                <h2 className="text-3xl font-bold text-white mb-2">Create Account</h2>
                <div className="flex justify-center mb-4">
                    <label className="w-24 h-24 rounded-full bg-gray-700 flex items-center justify-center cursor-pointer overflow-hidden border-2 border-blue-500 relative group">
                        {file ? <img src={URL.createObjectURL(file)} className="w-full h-full object-cover" /> : <Camera className="text-gray-400" />}
                        <div className="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center"><Edit size={20} /></div>
                        <input type="file" className="hidden" accept="image/*" onChange={handleFileChange} />
                    </label>
                </div>
                <input className="p-3 bg-gray-800 rounded text-white" placeholder="Email" onChange={e => setForm({ ...form, email: e.target.value })} />
                <input className="p-3 bg-gray-800 rounded text-white" type="password" placeholder="Password" onChange={e => setForm({ ...form, pass: e.target.value })} />
                <input className="p-3 bg-gray-800 rounded text-white" placeholder="Display Name" onChange={e => setForm({ ...form, display: e.target.value })} />
                <input className="p-3 bg-gray-800 rounded text-white" placeholder="Unique Username" onChange={e => setForm({ ...form, user: e.target.value })} />
                <button onClick={handleReg} disabled={uploading} className="bg-green-600 p-3 rounded font-bold text-white mt-4">
                    {uploading ? 'Creating Profile...' : 'Sign Up'}
                </button>
                <p className="text-center text-gray-400 mt-2 cursor-pointer hover:underline" onClick={() => setView('login')}>Back to Login</p>
            </div>
        );
    };

    // --- HOME COMPONENT ---
    const Home = ({ user, userData, showToast }) => {
        const [timer, setTimer] = React.useState(0);
        const [isRunning, setIsRunning] = React.useState(false);
        const [stories, setStories] = React.useState([]);
        const [viewer, setViewer] = React.useState(null);
        const [showViewersList, setShowViewersList] = React.useState(false);
        const [showSourceModal, setShowSourceModal] = React.useState(false);
        const [previewImage, setPreviewImage] = React.useState(null);
        const [fileToUpload, setFileToUpload] = React.useState(null);
        const [uploading, setUploading] = React.useState(false);
        const [isCameraOpen, setIsCameraOpen] = React.useState(false);
        const [facingMode, setFacingMode] = React.useState('environment');
        const videoRef = React.useRef(null);
        const canvasRef = React.useRef(null);
        const streamRef = React.useRef(null);
        const galleryInputRef = React.useRef(null);
        const [deleteConfirm, setDeleteConfirm] = React.useState(null);
        const [timerResult, setTimerResult] = React.useState(null);

        const timeAgo = (ts) => {
            const seconds = Math.floor((Date.now() - ts) / 1000);
            if (seconds < 60) return "Just now";
            const mins = Math.floor(seconds / 60);
            if (mins < 60) return `${mins} mins ago`;
            const hours = Math.floor(mins / 60);
            const remMins = mins % 60;
            if (hours < 24) return remMins === 0 ? `${hours} hr ago` : `${hours} hr ${remMins} mins ago`;
            return "Over 24h ago";
        };

        const formatTime = (ts) => new Date(ts).toLocaleString();

        const groupedStories = React.useMemo(() => {
            const groups = {};
            stories.forEach(story => {
                if (!groups[story.uid]) {
                    groups[story.uid] = { uid: story.uid, author: story.author, posts: [] };
                }
                groups[story.uid].posts.push(story);
            });
            return Object.values(groups);
        }, [stories]);

        React.useEffect(() => {
            let interval;
            if (isRunning) interval = setInterval(() => setTimer(t => t + 1), 1000);
            return () => clearInterval(interval);
        }, [isRunning]);

        const stopTimer = async () => {
            setIsRunning(false);
            if (timer > 0) {
                await db.collection('users').doc(user.uid).update({
                    coins: firebase.firestore.FieldValue.increment(timer)
                });
                setTimerResult(timer);
                setTimer(0);
            }
        };

        const formatTimerTime = (s) => {
            const mins = Math.floor(s / 60);
            const secs = s % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        };

        React.useEffect(() => {
            const fetchStories = async () => {
                const yesterday = Date.now() - 86400000;
                const snap = await db.collection('posts').get();
                const validStories = [];
                const myFriends = userData?.friends || [];
                snap.forEach(doc => {
                    const data = doc.data();
                    const isFriend = myFriends.includes(data.uid);
                    const isSelf = data.uid === user.uid;
                    if ((isFriend || isSelf) && data.timestamp > yesterday) {
                        validStories.push({ id: doc.id, ...data });
                    }
                });
                validStories.sort((a, b) => b.timestamp - a.timestamp);
                if (validStories.length > 0) {
                    const storyHeads = await Promise.all(validStories.map(async (story) => {
                        const authorData = story.uid === user.uid ? userData : (await db.collection('users').doc(story.uid).get()).data();
                        return { ...story, author: authorData };
                    }));
                    setStories(storyHeads);
                } else {
                    setStories([]);
                }
            };
            if (user && userData) fetchStories();
        }, [user, userData, uploading]);

        React.useEffect(() => {
            if (viewer) {
                const currentStory = viewer.posts[viewer.index];
                if (!currentStory) return;
                const amIAuthor = currentStory.uid === user.uid;
                const alreadyViewed = currentStory.viewers?.some(v => v.uid === user.uid);
                if (!amIAuthor && !alreadyViewed) {
                    const viewData = { uid: user.uid, username: userData.username, timestamp: Date.now() };
                    setStories(prev => prev.map(s => s.id === currentStory.id ? { ...s, viewers: [...(s.viewers || []), viewData] } : s));
                    db.collection('posts').doc(currentStory.id).update({
                        viewers: firebase.firestore.FieldValue.arrayUnion(viewData)
                    }).catch(console.error);
                }
            }
        }, [viewer?.index, viewer?.posts]);

        const openCamera = async () => {
            setShowSourceModal(false);
            setIsCameraOpen(true);
            startCameraStream(facingMode);
        };

        const startCameraStream = async (mode) => {
            if (streamRef.current) {
                streamRef.current.getTracks().forEach(track => track.stop());
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: mode } 
                });
                streamRef.current = stream;
                if (videoRef.current) {
                    videoRef.current.srcObject = stream;
                }
            } catch (err) {
                console.error("Camera Error:", err);
                showToast("Camera access denied. Check permissions.", "error");
                setIsCameraOpen(false);
            }
        };

        const closeCamera = () => {
            if (streamRef.current) {
                streamRef.current.getTracks().forEach(track => track.stop());
                streamRef.current = null;
            }
            setIsCameraOpen(false);
        };

        const switchCamera = () => {
            const newMode = facingMode === 'environment' ? 'user' : 'environment';
            setFacingMode(newMode);
            startCameraStream(newMode);
        };

        const takePhoto = () => {
            if (!videoRef.current || !canvasRef.current) return;
            const video = videoRef.current;
            const canvas = canvasRef.current;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            if (facingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => {
                const file = new File([blob], "camera_capture.jpg", { type: "image/jpeg" });
                setFileToUpload(file);
                setPreviewImage(URL.createObjectURL(file));
                closeCamera();
            }, 'image/jpeg');
        };

        const handleFileSelect = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setFileToUpload(file);
            setPreviewImage(URL.createObjectURL(file));
            setShowSourceModal(false);
        };

        const confirmPost = async () => {
            if (!fileToUpload) return;
            setUploading(true);
            try {
                const formData = new FormData();
                formData.append('file', fileToUpload);
                formData.append('upload_preset', UPLOAD_PRESET);
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                const url = data.secure_url;

                if(url) {
                    await db.collection('posts').add({
                        uid: user.uid,
                        imageUrl: url,
                        timestamp: Date.now(),
                        viewers: []
                    });
                    showToast("Posted successfully!");
                    setPreviewImage(null);
                    setFileToUpload(null);
                }
            } catch (err) {
                showToast("Error: " + err.message, "error");
            }
            setUploading(false);
        };

        const discardPost = () => {
            setPreviewImage(null);
            setFileToUpload(null);
        };

        const initiateDelete = () => {
            if(!viewingStory) return;
            setDeleteConfirm(viewingStory);
        };

        const finalizeDelete = async () => {
            if(!deleteConfirm) return;
            
            try {
                await db.collection('posts').doc(deleteConfirm.id).delete();
                showToast("Post deleted");
                
                const updatedPosts = viewer.posts.filter(p => p.id !== deleteConfirm.id);
                if(updatedPosts.length === 0) {
                    setViewer(null);
                } else {
                    let newIndex = viewer.index;
                    if(newIndex >= updatedPosts.length) newIndex = updatedPosts.length - 1;
                    setViewer({ ...viewer, posts: updatedPosts, index: newIndex });
                }
                setStories(prev => prev.filter(p => p.id !== deleteConfirm.id));
                setDeleteConfirm(null);
            } catch(e) {
                showToast("Error: " + e.message, "error");
            }
        };

        const openStoryGroup = (group) => {
            const sortedPosts = [...group.posts].sort((a,b) => a.timestamp - b.timestamp);
            setViewer({ posts: sortedPosts, index: 0 });
            setShowViewersList(false);
        };

        const handleNextStory = (e) => {
            if(e) e.stopPropagation();
            if(!viewer) return;
            if(viewer.index < viewer.posts.length - 1) {
                setViewer(prev => ({ ...prev, index: prev.index + 1 }));
            } else {
                setViewer(null);
            }
        };

        const handlePrevStory = (e) => {
            if(e) e.stopPropagation();
            if(!viewer) return;
            if(viewer.index > 0) {
                setViewer(prev => ({ ...prev, index: prev.index - 1 }));
            } else {
                setViewer(null);
            }
        };

        const viewingStory = viewer ? viewer.posts[viewer.index] : null;
        const isOwner = viewingStory && viewingStory.uid === user.uid;
        const postAgeHours = viewingStory ? (Date.now() - viewingStory.timestamp) / (1000 * 60 * 60) : 0;
        const canDelete = isOwner && postAgeHours < 24;

        return (
            <div className="flex flex-col h-full bg-gray-900 pb-20 relative">
                
                {deleteConfirm && (
                    <div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4 animate-fade-in pointer-events-auto">
                        <div className="bg-gray-800 p-6 rounded-xl border border-gray-700 w-full max-w-sm animate-pop-up">
                            <h3 className="text-xl font-bold mb-2 text-white">Delete Post?</h3>
                            <p className="text-gray-400 mb-6 text-sm">This action cannot be undone.</p>
                            <div className="flex space-x-3">
                                <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-gray-700 rounded-lg text-white font-medium hover:bg-gray-600 transition">Cancel</button>
                                <button onClick={finalizeDelete} className="flex-1 py-3 bg-red-600 rounded-lg text-white font-bold hover:bg-red-500 transition shadow-lg shadow-red-900/20">Delete</button>
                            </div>
                        </div>
                    </div>
                )}

                {timerResult !== null && (
                    <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4 animate-fade-in pointer-events-auto">
                        <div className="bg-gray-900 p-8 rounded-2xl border-2 border-yellow-500/30 w-full max-w-sm flex flex-col items-center text-center shadow-[0_0_50px_rgba(234,179,8,0.15)] animate-pop-up relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-yellow-500/10 to-transparent pointer-events-none"></div>
                            
                            <Trophy size={64} className="text-yellow-400 mb-4 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)] animate-bounce" />
                            <h2 className="text-2xl font-bold text-white mb-2">Session Complete!</h2>
                            <p className="text-gray-400 mb-6 text-sm">Great focus! You've earned</p>
                            
                            <div className="text-5xl font-mono font-bold text-yellow-400 mb-8 tracking-wider drop-shadow-sm">
                                +{timerResult} <span className="text-lg text-yellow-600">coins</span>
                            </div>
                            
                            <button onClick={() => setTimerResult(null)} className="w-full py-3 bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-black font-bold rounded-xl transition transform active:scale-95 shadow-lg">
                                Collect Rewards
                            </button>
                        </div>
                    </div>
                )}

                <div className="p-4 flex justify-between items-center bg-gray-800 shadow-md">
                    <span className="font-bold text-xl text-blue-400">StudySync</span>
                    <div className="flex items-center space-x-2 bg-gray-700 px-3 py-1 rounded-full">
                        <span className="text-yellow-400 font-bold">{userData.coins}</span>
                        <div className="w-4 h-4 bg-yellow-500 rounded-full text-[10px] flex items-center justify-center text-black font-bold">$</div>
                    </div>
                </div>

                <div className="p-4 space-y-4">
                    <div className="flex space-x-3 overflow-x-auto no-scrollbar pb-2">
                        <div className="flex-shrink-0 flex flex-col items-center space-y-1 w-16">
                            <div className="w-16 h-16 rounded-full border-2 border-blue-500 p-0.5 bg-gray-800">
                                <img
                                    src={userData?.photoURL || DEFAULT_AVATAR}
                                    className="w-full h-full rounded-full object-cover"
                                    alt="Your avatar"
                                />
                            </div>
                            <span className="text-[10px] text-gray-400 truncate w-full text-center">You</span>
                        </div>
                        <div onClick={() => setShowSourceModal(true)} className="flex-shrink-0 flex flex-col items-center space-y-1 cursor-pointer w-16">
                            <div className="w-16 h-16 rounded-full border-2 border-dashed border-gray-500 flex items-center justify-center bg-gray-800 hover:bg-gray-700 transition">
                                <span className="text-gray-300 text-3xl font-bold leading-none">+</span>
                            </div>
                            <span className="text-[10px] text-gray-400 truncate w-full text-center">Add</span>
                        </div>
                         
                         {groupedStories.map(group => {
                            const allViewed = group.posts.every(p => {
                                const isMe = p.uid === user.uid;
                                const isViewed = p.viewers?.some(v => v.uid === user.uid);
                                return isMe || isViewed;
                            });
                            const isMe = group.uid === user.uid;
                            const borderClass = isMe ? 'border-gray-600' : (allViewed ? 'border-gray-600' : 'border-blue-500 border-2');

                            return (
                                <div key={group.uid} onClick={() => openStoryGroup(group)} className="flex-shrink-0 flex flex-col items-center space-y-1 cursor-pointer w-16">
                                    <div className={`w-16 h-16 rounded-full p-0.5 ${borderClass} transition-colors duration-300`}>
                                        <img src={group.author?.photoURL || 'https://via.placeholder.com/150'} className="w-full h-full rounded-full object-cover bg-gray-800" />
                                    </div>
                                    <span className="text-[10px] text-gray-400 truncate w-full text-center">{group.author?.username}</span>
                                </div>
                            );
                        })}
                    </div>
                </div>

                {showSourceModal && (
                    <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 animate-fade-in" onClick={(e) => { if(e.target === e.currentTarget) setShowSourceModal(false) }}>
                        <div className="bg-gray-800 p-8 rounded-2xl flex space-x-8 items-center border border-gray-700 shadow-2xl transform scale-100 transition-transform">
                            <div onClick={openCamera} className="flex flex-col items-center space-y-2 cursor-pointer active:scale-90 transition transform">
                                <div className="w-20 h-20 rounded-full bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center shadow-lg border-2 border-white/20">
                                    <Camera size={36} className="text-white drop-shadow-md" />
                                </div>
                            </div>
                            <div className="h-16 w-px bg-gray-600"></div>
                            <div onClick={() => galleryInputRef.current.click()} className="flex flex-col items-center space-y-2 cursor-pointer active:scale-90 transition transform">
                                <div className="w-20 h-20 rounded-full bg-gray-700 border-2 border-gray-500 flex items-center justify-center shadow-lg">
                                    <Image size={36} className="text-white drop-shadow-md" />
                                </div>
                                <input ref={galleryInputRef} type="file" accept="image/*" className="hidden" onChange={handleFileSelect} />
                            </div>
                        </div>
                    </div>
                )}

                {isCameraOpen && (
                    <div className="fixed inset-0 bg-black z-[60] flex flex-col">
                        <div className="flex-1 relative bg-black overflow-hidden">
                            <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover"></video>
                            <button onClick={switchCamera} className="absolute top-4 right-4 p-3 bg-black/40 rounded-full backdrop-blur-md text-white"><SwitchCam size={24} /></button>
                            <button onClick={closeCamera} className="absolute top-4 left-4 p-3 bg-black/40 rounded-full backdrop-blur-md text-white"><X size={24} /></button>
                        </div>
                        <div className="h-32 bg-black flex items-center justify-center relative">
                            <button onClick={takePhoto} className="w-20 h-20 rounded-full bg-white border-4 border-gray-300 flex items-center justify-center active:scale-95 transition">
                                <div className="w-16 h-16 rounded-full border-2 border-black"></div>
                            </button>
                        </div>
                        <canvas ref={canvasRef} className="hidden"></canvas>
                    </div>
                )}

                {previewImage && (
                    <div className="fixed inset-0 bg-black z-[60] flex flex-col items-center justify-center animate-fade-in">
                        <div className="flex-1 w-full flex items-center justify-center p-4">
                            <img src={previewImage} className="max-w-full max-h-[70vh] object-contain rounded-xl shadow-2xl border border-gray-800" />
                        </div>
                        <div className="h-32 w-full bg-black/50 flex items-center justify-center space-x-12 backdrop-blur-md absolute bottom-0">
                             <button onClick={discardPost} disabled={uploading} className="w-16 h-16 rounded-full bg-red-500/20 text-red-500 border-2 border-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition active:scale-90">
                                <X size={32} strokeWidth={3} />
                             </button>
                             <button onClick={confirmPost} disabled={uploading} className="w-20 h-20 rounded-full bg-green-500 text-white flex items-center justify-center shadow-[0_0_30px_rgba(34,197,94,0.6)] hover:bg-green-400 transition transform hover:scale-105 active:scale-95">
                                {uploading ? <div className="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"/> : <Check size={40} strokeWidth={4} />}
                             </button>
                        </div>
                    </div>
                )}

                <div className="flex-1 flex flex-col items-center justify-center space-y-8 min-h-[300px]">
                    <div className={`w-64 h-64 rounded-full border-8 flex items-center justify-center shadow-[0_0_50px_rgba(59,130,246,0.5)] transition-all duration-500 ${isRunning ? 'border-blue-500 scale-105' : 'border-gray-700'}`}>
                        <span className="text-6xl font-mono tracking-widest">{formatTimerTime(timer)}</span>
                    </div>
                    <div className="flex space-x-6">
                        {!isRunning ? (
                            <button onClick={() => setIsRunning(true)} className="bg-green-600 w-16 h-16 rounded-full flex items-center justify-center hover:bg-green-500 shadow-lg"><Play fill="white" /></button>
                        ) : (
                            <div className="flex space-x-4">
                                <button onClick={() => setIsRunning(false)} className="bg-yellow-600 w-16 h-16 rounded-full flex items-center justify-center hover:bg-yellow-500"><Pause fill="white" /></button>
                                <button onClick={stopTimer} className="bg-red-600 w-16 h-16 rounded-full flex items-center justify-center hover:bg-red-500"><Square fill="white" /></button>
                            </div>
                        )}
                    </div>
                </div>

                {viewingStory && (
                    <div className="fixed inset-0 bg-black z-50 flex flex-col">
                        <div className="p-4 flex items-center space-x-3 bg-gradient-to-b from-black/80 to-transparent absolute top-0 w-full z-20 pointer-events-auto">
                            <img src={viewingStory.author?.photoURL || 'https://via.placeholder.com/40'} className="w-10 h-10 rounded-full border border-white" />
                            <div className="flex-col flex">
                                <span className="font-bold text-white shadow-black drop-shadow-md">{viewingStory.author?.username}</span>
                                <span className="text-xs text-gray-300">
                                    {timeAgo(viewingStory.timestamp)}
                                </span>
                                <span className="text-[10px] text-gray-400 ml-2"> {viewer.index + 1} / {viewer.posts.length}</span>
                            </div>
                            <div className="flex-1"></div>
                            
                            {canDelete && (
                                <button onClick={initiateDelete} className="p-2 bg-red-600/80 rounded-full mr-2 hover:bg-red-500 transition">
                                    <Trash size={18} className="text-white" />
                                </button>
                            )}

                            <button onClick={() => setViewer(null)} className="p-2 bg-black/40 rounded-full backdrop-blur-sm"><X className="text-white" /></button>
                        </div>

                        <div className="flex-1 flex items-center justify-center bg-gray-900 relative">
                            <div className="relative aspect-[9/16] h-full max-h-[90vh] w-full bg-black flex items-center justify-center overflow-hidden">
                                <img src={viewingStory.imageUrl} className="max-w-full max-h-full object-contain" />
                                
                                <div className="absolute inset-y-0 left-0 w-1/3 z-10" onClick={handlePrevStory}></div>
                                <div className="absolute inset-y-0 right-0 w-2/3 z-10" onClick={handleNextStory}></div>

                                <button onClick={handlePrevStory} className="absolute left-2 top-1/2 -translate-y-1/2 p-3 bg-black/30 text-white rounded-full z-20 hover:bg-black/50 transition">
                                    <ChevronLeft size={24} />
                                </button>
                                <button onClick={handleNextStory} className="absolute right-2 top-1/2 -translate-y-1/2 p-3 bg-black/30 text-white rounded-full z-20 hover:bg-black/50 transition">
                                    <ChevronRight size={24} />
                                </button>
                            </div>

                            {showViewersList && (
                                <div className="absolute inset-0 bg-black/90 z-30 p-6 overflow-y-auto animate-fade-in" onClick={e => e.stopPropagation()}>
                                    <h3 className="text-xl font-bold mb-4 border-b border-gray-700 pb-2">Viewed by ({viewingStory.viewers?.length || 0})</h3>
                                    <div className="space-y-3">
                                        {viewingStory.viewers?.map((v, i) => (
                                            <div key={i} className="flex justify-between items-center text-sm text-gray-300">
                                                <span>{v.username}</span>
                                                <span className="text-gray-500 text-xs">{formatTime(v.timestamp)}</span>
                                            </div>
                                        ))}
                                        {(!viewingStory.viewers || viewingStory.viewers.length === 0) && <p className="text-gray-500">No views yet.</p>}
                                    </div>
                                    <button onClick={() => setShowViewersList(false)} className="mt-6 w-full py-3 bg-gray-800 rounded text-sm">Close List</button>
                                </div>
                            )}
                        </div>

                        <div className="absolute bottom-0 w-full p-4 bg-black/60 z-20 flex justify-between items-center pointer-events-none">
                            <div className="text-sm"><Eye size={14} className="inline mr-1" /> {viewingStory.viewers?.length || 0} views</div>
                            {viewingStory.author.uid === user.uid && (
                                <button onClick={() => setShowViewersList(true)} className="text-xs bg-white/20 px-3 py-1 rounded-full hover:bg-white/30 transition pointer-events-auto">See Details</button>
                            )}
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // --- FRIENDS COMPONENT ---
    const Friends = ({ user, showToast }) => {
        const [activeTab, setActiveTab] = React.useState('friends');
        const [myFriends, setMyFriends] = React.useState([]);
        const [requests, setRequests] = React.useState([]);
        const [searchQuery, setSearchQuery] = React.useState('');
        const [addUsername, setAddUsername] = React.useState('');

        React.useEffect(() => {
            const fetchFriends = async () => {
                const uDoc = await db.collection('users').doc(user.uid).get();
                const friendIds = uDoc.data()?.friends || [];
                
                if (friendIds.length === 0) {
                    setMyFriends([]);
                    return;
                }

                const friendsData = await Promise.all(
                    friendIds.map(async (fid) => {
                        const d = await db.collection('users').doc(fid).get();
                        return d.exists ? { uid: d.id, ...d.data() } : null;
                    })
                );
                setMyFriends(friendsData.filter(f => f !== null));
            };

            fetchFriends();
        }, [user, activeTab]);

        React.useEffect(() => {
            const unsub = db.collection('friend_requests')
                .where('to', '==', user.uid)
                .where('status', '==', 'pending')
                .onSnapshot(async (snap) => {
                    const reqs = await Promise.all(snap.docs.map(async (d) => {
                        const data = d.data();
                        const senderDoc = await db.collection('users').doc(data.from).get();
                        return { 
                            id: d.id, 
                            sender: senderDoc.exists ? senderDoc.data() : { displayName: 'Unknown' },
                            ...data 
                        };
                    }));
                    setRequests(reqs);
                });
            return () => unsub();
        }, [user]);

        const handleSendRequest = async () => {
            const targetUsername = addUsername.trim();
            if (!targetUsername) return;

            try {
                const querySnap = await db.collection('users').where('username', '==', targetUsername).get();
                
                if (querySnap.empty) {
                    showToast("User not found.", "error");
                    return;
                }

                const targetUserDoc = querySnap.docs[0];
                const targetUid = targetUserDoc.id;

                const myDoc = await db.collection('users').doc(user.uid).get();
                const myCurrentFriends = myDoc.data()?.friends || [];

                if (myCurrentFriends.includes(targetUid)) {
                    showToast("You are already friends with this user!", "error");
                    return;
                }

                if (targetUid === user.uid) {
                    showToast("You cannot friend yourself.", "error");
                    return;
                }

                await db.collection('friend_requests').add({
                    from: user.uid,
                    to: targetUid,
                    status: 'pending',
                    timestamp: Date.now()
                });

                showToast(`Request sent to ${targetUsername}!`, "success");
                setAddUsername('');

            } catch (error) {
                console.error(error);
                showToast("Error sending request.", "error");
            }
        };

        const handleAccept = async (reqId, senderUid) => {
            try {
                const batch = db.batch();
                
                const myRef = db.collection('users').doc(user.uid);
                batch.update(myRef, {
                    friends: firebase.firestore.FieldValue.arrayUnion(senderUid)
                });

                const senderRef = db.collection('users').doc(senderUid);
                batch.update(senderRef, {
                    friends: firebase.firestore.FieldValue.arrayUnion(user.uid)
                });

                const reqRef = db.collection('friend_requests').doc(reqId);
                batch.delete(reqRef);

                await batch.commit();
                showToast("Friend request accepted!", "success");

            } catch (err) {
                console.error(err);
                showToast("Failed to accept request.", "error");
            }
        };

        const handleReject = async (reqId) => {
            try {
                await db.collection('friend_requests').doc(reqId).delete();
                showToast("Request removed.", "success");
            } catch (err) {
                showToast("Error removing request.", "error");
            }
        };

        const filteredFriends = myFriends.filter(f => {
            const lowerQ = searchQuery.toLowerCase();
            return (f.displayName || '').toLowerCase().includes(lowerQ) || 
                   (f.username || '').toLowerCase().includes(lowerQ);
        });

        return (
            <div className="flex flex-col h-full bg-gray-900 pb-20 pt-4 px-4 overflow-y-auto no-scrollbar">
                <h2 className="text-2xl font-bold mb-4">Social</h2>

                <div className="flex space-x-4 border-b border-gray-700 pb-2 mb-4">
                    <button 
                        onClick={() => setActiveTab('friends')}
                        className={`pb-2 px-2 text-sm font-medium transition-colors ${
                            activeTab === 'friends' ? 'text-blue-500 border-b-2 border-blue-500' : 'text-gray-400'
                        }`}
                    >
                        My Friends
                    </button>
                    <button 
                        onClick={() => setActiveTab('pending')}
                        className={`pb-2 px-2 text-sm font-medium transition-colors ${
                            activeTab === 'pending' ? 'text-blue-500 border-b-2 border-blue-500' : 'text-gray-400'
                        }`}
                    >
                        Pending
                        {requests.length > 0 && (
                            <span className="ml-2 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">
                                {requests.length}
                            </span>
                        )}
                    </button>
                </div>

                {activeTab === 'friends' && (
                    <div className="animate-fade-in">
                        <div className="relative mb-4">
                            <input
                                type="text"
                                placeholder="Search friends..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full bg-gray-800 text-white rounded-lg pl-10 pr-4 py-2 border border-gray-700 focus:border-blue-500 focus:outline-none"
                            />
                            <div className="absolute left-3 top-2.5 text-gray-400">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </div>
                        </div>

                        <div className="space-y-3">
                            {filteredFriends.length > 0 ? (
                                filteredFriends.map(friend => (
                                    <div key={friend.uid} className="flex items-center bg-gray-800 p-3 rounded-lg border border-gray-700">
                                        <img 
                                            src={friend.photoURL || DEFAULT_AVATAR} 
                                            className="w-10 h-10 rounded-full object-cover border border-gray-600" 
                                            alt="avatar"
                                        />
                                        <div className="ml-3">
                                            <p className="font-semibold text-gray-200">{friend.displayName || "User"}</p>
                                            <p className="text-xs text-gray-500">@{friend.username}</p>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <p className="text-gray-500 text-center mt-10">
                                    {searchQuery ? "No matching friends found." : "No friends yet. Go to Pending to add someone!"}
                                </p>
                            )}
                        </div>
                    </div>
                )}

                {activeTab === 'pending' && (
                    <div className="animate-fade-in space-y-6">
                        <div className="bg-gray-800 p-4 rounded-lg border border-gray-700">
                            <h3 className="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Add Friend</h3>
                            <div className="flex space-x-2">
                                <input
                                    type="text"
                                    placeholder="Enter username..."
                                    value={addUsername}
                                    onChange={(e) => setAddUsername(e.target.value)}
                                    className="flex-1 bg-gray-900 text-white rounded px-3 py-2 border border-gray-600 focus:border-blue-500 focus:outline-none"
                                />
                                <button 
                                    onClick={handleSendRequest}
                                    className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded transition-colors font-medium"
                                >
                                    Add
                                </button>
                            </div>
                        </div>

                        <div>
                            <h3 className="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">
                                Incoming Requests ({requests.length})
                            </h3>
                            
                            <div className="space-y-3">
                                {requests.length > 0 ? (
                                    requests.map(req => (
                                        <div key={req.id} className="bg-gray-800 p-3 rounded-lg border border-gray-700 flex items-center justify-between">
                                            <div className="flex items-center">
                                                <img 
                                                    src={req.sender?.photoURL || DEFAULT_AVATAR} 
                                                    className="w-10 h-10 rounded-full object-cover border border-gray-600"
                                                />
                                                <div className="ml-3">
                                                    <p className="font-semibold text-gray-200">{req.sender?.displayName}</p>
                                                    <p className="text-xs text-gray-500">@{req.sender?.username}</p>
                                                </div>
                                            </div>
                                            <div className="flex space-x-2">
                                                <button 
                                                    onClick={() => handleAccept(req.id, req.from)}
                                                    className="p-2 bg-green-600/20 text-green-400 rounded hover:bg-green-600/30"
                                                >
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                </button>
                                                <button 
                                                    onClick={() => handleReject(req.id)}
                                                    className="p-2 bg-red-600/20 text-red-400 rounded hover:bg-red-600/30"
                                                >
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                                </button>
                                            </div>
                                        </div>
                                    ))
                                ) : (
                                    <p className="text-gray-500 text-sm">No pending requests.</p>
                                )}
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // --- LEADERBOARD COMPONENT ---
    const Leaderboard = ({ user }) => {
        const [list, setList] = React.useState([]);
        React.useEffect(() => {
            const fetchLB = async () => {
                const uDoc = await db.collection('users').doc(user.uid).get();
                const myData = uDoc.data();
                const friendIds = myData.friends || [];
                const people = [myData];
                await Promise.all(friendIds.map(async fid => {
                    const d = await db.collection('users').doc(fid).get();
                    if(d.exists) people.push(d.data());
                }));
                people.sort((a,b) => b.coins - a.coins);
                setList(people);
            };
            fetchLB();
        }, [user]);

        return (
            <div className="p-4">
                <h2 className="text-2xl font-bold mb-4 flex items-center"><Trophy className="mr-2 text-yellow-500"/> Leaderboard</h2>
                <div className="space-y-2">
                    {list.map((p, i) => (
                        <div key={p.uid} className={`flex items-center p-4 rounded-lg ${p.uid === user.uid ? 'bg-blue-900/30 border border-blue-500' : 'bg-gray-800'}`}>
                            <span className={`font-bold text-lg w-8 ${i===0?'text-yellow-400':i===1?'text-gray-300':i===2?'text-orange-400':'text-gray-500'}`}>#{i+1}</span>
                            <img src={p.photoURL} className="w-10 h-10 rounded-full mx-3 object-cover" />
                            <div className="flex-1"><p className="font-bold">{p.displayName}</p><p className="text-xs text-gray-400">@{p.username}</p></div>
                            <span className="font-mono font-bold text-yellow-500">{p.coins} ¢</span>
                        </div>
                    ))}
                </div>
            </div>
        );
    };

    // --- SETTINGS COMPONENT ---
    const Settings = ({ user, userData, showToast }) => {
        const [isEditingName, setIsEditingName] = React.useState(false);
        const [newName, setNewName] = React.useState(userData?.displayName || "");
        const [croppingSrc, setCroppingSrc] = React.useState(null);

        const handlePassReset = () => {
            auth.sendPasswordResetEmail(user.email)
                .then(() => showToast("Password reset email sent! Check your inbox."))
                .catch(e => showToast(e.message, 'error'));
        };

        const saveName = async () => {
            if(!newName.trim()) return;
            try {
                await db.collection('users').doc(user.uid).update({ displayName: newName });
                setIsEditingName(false);
                showToast("Display Name Updated!");
            } catch(e) {
                showToast("Error: " + e.message, 'error');
            }
        };

        const uploadImage = async (file) => {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            try {
                showToast("Uploading new photo...");
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                return data.secure_url;
            } catch (error) {
                console.error("Upload failed", error);
                return null;
            }
        };

        const handleFileChange = (e) => {
            const selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = () => setCroppingSrc(reader.result);
                reader.readAsDataURL(selectedFile);
            }
        };

        const handleCropConfirm = async (blob) => {
            setCroppingSrc(null);
            const url = await uploadImage(blob);
            if(url) {
                await db.collection('users').doc(user.uid).update({ photoURL: url });
                showToast("Profile picture updated!");
            } else {
                showToast("Failed to upload image", 'error');
            }
        };

        return (
            <div className="p-6 pt-10">
                {croppingSrc && (
                    <ImageCropper 
                        src={croppingSrc} 
                        onCancel={() => setCroppingSrc(null)} 
                        onConfirm={handleCropConfirm} 
                    />
                )}

                <h2 className="text-2xl font-bold mb-6">Settings</h2>
                
                <div className="bg-gray-800 p-4 rounded-xl space-y-6 border border-gray-700">
                    <div className="flex items-center space-x-4">
                        <label className="relative cursor-pointer group">
                            <img src={userData?.photoURL || DEFAULT_AVATAR} className="w-16 h-16 rounded-full border-2 border-purple-500 object-cover" />
                            <div className="absolute inset-0 bg-black/50 rounded-full hidden group-hover:flex items-center justify-center"><Edit size={16} /></div>
                            <input type="file" className="hidden" accept="image/*" onChange={handleFileChange} />
                        </label>
                        
                        <div className="flex-1">
                            <p className="text-gray-400 text-xs uppercase">Display Name</p>
                            {!isEditingName ? (
                                <div className="flex items-center justify-between">
                                    <h3 className="text-xl font-bold">{userData?.displayName}</h3>
                                    <button onClick={() => setIsEditingName(true)} className="text-xs bg-gray-700 px-2 py-1 rounded text-blue-300">Change</button>
                                </div>
                            ) : (
                                <div className="mt-1 flex space-x-2">
                                    <input type="text" value={newName} onChange={(e) => setNewName(e.target.value)} className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm flex-1 outline-none focus:border-purple-500"/>
                                    <button onClick={saveName} className="bg-green-600 px-3 py-1 rounded text-xs font-bold">OK</button>
                                    <button onClick={() => setIsEditingName(false)} className="bg-red-900/50 text-red-300 px-2 py-1 rounded text-xs">X</button>
                                </div>
                            )}
                            <p className="text-gray-500 text-sm mt-1">{user.email}</p>
                            <p className="text-gray-600 text-xs mt-1">@{userData.username}</p>
                        </div>
                    </div>

                    <hr className="border-gray-700" />

                    <div className="space-y-3">
                        <button onClick={handlePassReset} className="w-full bg-gray-700 hover:bg-gray-600 p-3 rounded text-sm text-gray-200 transition">
                            Change Password (via Email)
                        </button>
                        <button onClick={() => auth.signOut()} className="w-full bg-red-900/20 text-red-400 border border-red-900/50 hover:bg-red-900/40 p-3 rounded flex items-center justify-center space-x-2 transition">
                            <SignOutIcon size={16} /> <span>Sign Out</span>
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // --- BOTTOM NAVIGATION ---
    const BottomNav = ({ view, setView }) => {
        const NavBtn = ({ id, Icon, label }) => (
            <button className={`relative flex flex-col items-center ${view === id ? 'text-blue-500' : 'text-gray-500'}`} onClick={() => setView(id)}>
                <Icon size={24} />
                <span className="text-[10px] mt-1">{label}</span>
            </button>
        );

        return (
            <div className="absolute bottom-0 w-full h-16 bg-gray-800 border-t border-gray-700 flex justify-around items-center px-2 z-40">
                <NavBtn id="home" Icon={Clock} label="Study" />
                <NavBtn id="friends" Icon={Users} label="Friends" />
                <NavBtn id="leaderboard" Icon={Trophy} label="Rank" />
                <NavBtn id="settings" Icon={SettingsIcon} label="Settings" />
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
